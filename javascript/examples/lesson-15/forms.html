<!doctype html>
<html lang="km">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lesson 15: Forms</title><script src="forms.js" defer></script></head>
  <body>
    <h1>ចុះឈ្មោះ</h1>
    <form id="signup">
      <label for="name">ឈ្មោះ</label>
      <input id="name" name="name" required minlength="2">
      <label for="email">អ៊ីមែល</label>
      <input id="email" name="email" type="email" required>
      <label><input name="accepted" type="checkbox" required> ខ្ញុំយល់ព្រម</label>
      <button type="submit">បញ្ជូន</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </body>
</html>
