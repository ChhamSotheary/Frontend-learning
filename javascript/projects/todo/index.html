<!doctype html>
<html lang="km">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List — JavaScript Course</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>បញ្ជីកិច្ចការ</h1>
      <form id="todo-form">
        <label for="todo-input">កិច្ចការថ្មី</label>
        <div class="form-row">
          <input id="todo-input" name="todo" maxlength="120" required autocomplete="off">
          <button type="submit">បន្ថែម</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="todo-list" aria-label="កិច្ចការរបស់ខ្ញុំ"></ul>
      <button id="clear-completed" type="button">លុបកិច្ចការដែលរួច</button>
    </main>
  </body>
</html>
